name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK from Website
        uses: Laisky/android-webview-action@v1
        with:
          url: https://nashid1712.github.io/budget-tracker/
          app-name: BUDGET TRACKAR
          app-package: com.nashid1712.budgettrackar
          app-icon: https://cdn-icons-png.flaticon.com/512/1170/1170678.png
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUDGET-TRACKAR-APK
          path: "*.apk"



