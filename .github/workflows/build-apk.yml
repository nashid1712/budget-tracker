name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          mkdir -p dist
          cp index.html dist/index.html

          npx cap init "BUDGET TRACKAR" com.nashid1712.budgettrackar --web-dir=dist
          npx cap add android
          printf '{"appId":"com.nashid1712.budgettrackar","appName":"BUDGET TRACKAR","webDir":"dist","server":{"url":"https://nashid1712.github.io/budget-tracker/","cleartext":true}}' > capacitor.config.json
          npx cap copy android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUDGET-TRACKAR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
