name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        uses: pwa-builder/pwa-for-store/actions/publish-android@main
        with:
          url: https://nashid1712.github.io/budget-tracker/
          packageId: com.nashid1712.budgettrackar
          appName: BUDGET TRACKAR
          versionName: 1.0
