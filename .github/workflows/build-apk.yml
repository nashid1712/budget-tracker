name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (www)
        run: |
          mkdir www
          if [ -f docs/index.html ]; then
            cp -r docs/. www/
          else
            rsync -a --exclude='.git' --exclude='.github' --exclude='www' \
              --exclude='node_modules' --exclude='android' ./ www/
          fi
          test -f www/index.html || (echo "index.html not found" && exit 1)

      - name: Set up Capacitor and Android project
        run: |
          mkdir -p /tmp/cap && cd /tmp/cap
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp -r "$GITHUB_WORKSPACE/www" ./www
          npx cap init "Budget Tracker" com.nashid.budgettracker --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd /tmp/cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: budget-tracker-apk
          path: /tmp/cap/android/app/build/outputs/apk/debug/app-debug.apk
