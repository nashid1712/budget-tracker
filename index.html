<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUDGET TRACKAR </title>
  <link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080808;color:#fff;padding-bottom:110px}
.card{background:#141414;border:1px solid #222;border-radius:22px;padding:18px;margin:12px 16px}
.b{font-size:42px;font-weight:900}.g{color:#22c55e}.r{color:#ff4d4d}.s{color:#777;font-size:11px}
.i{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:12px;padding:13px;color:#fff;margin:6px 0}
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-weight:900}
.page{display:none}.page.on{display:block}
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:#1d1d1df0;backdrop-filter:blur(20px);border:1px solid #333;border-radius:24px;display:flex;justify-content:space-around;padding:10px 4px;z-index:99}
.nav button{background:none;border:none;color:#666;font-size:9px;font-weight:800}.nav button.on{color:#22c55e}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1f1f1f}
.lock{position:fixed;inset:0;background:#050505;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.dots{display:flex;gap:12px;margin:20px}.dot{width:16px;height:16px;border-radius:50%;border:2px solid #333}.dot.on{background:#22c55e;border-color:#22c55e}
.keypad{display:grid;grid-template-columns:repeat(3,80px);gap:14px;margin-top:14px}
.key{width:80px;height:80px;border-radius:50%;background:#151515;border:1px solid #2a2a2a;color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center}
.img-prev{width:100%;border-radius:12px;margin-top:8px;max-height:220px;object-fit:cover;display:none;border:1px solid #333}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
</style>
</head>
<body>

<div id="lockScreen" class="lock">
<h1 style="font-weight:900">BUDGET TRACKAR</h1>
<p class="s" id="lockText" style="margin-top:8px">4 Digit PIN Set ചെയ്യുക</p>
<div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
<div class="keypad">
<div class="key" onclick="press(1)">1</div><div class="key" onclick="press(2)">2</div><div class="key" onclick="press(3)">3</div>
<div class="key" onclick="press(4)">4</div><div class="key" onclick="press(5)">5</div><div class="key" onclick="press(6)">6</div>
<div class="key" onclick="press(7)">7</div><div class="key" onclick="press(8)">8</div><div class="key" onclick="press(9)">9</div>
<div class="key" style="background:none;border:none" onclick="clearPin()">✕</div><div class="key" onclick="press(0)">0</div><div class="key" style="background:none;border:none" onclick="removePin()">⌫</div>
</div>
<p class="s" style="margin-top:20px;text-decoration:underline" onclick="skipLock()" id="skipBtn">Skip</p>
</div>

<div style="padding:20px 18px;display:flex;justify-content:space-between">
<div><h2>BUDGET TRACKAR</h2><p class="s"></p></div>
<div style="display:flex;gap:6px"><button onclick="setLim()" style="background:#1e1e1e;border:1px solid #333;color:#fff;padding:8px 10px;border-radius:10px">🎯</button><button onclick="changePin()" style="background:#1e1e1e;border:1px solid #333;color:#fff;padding:8px 10px;border-radius:10px">🔑</button></div>
</div>

<!-- HOME -->
<div id="p0" class="page on">
<div class="card"><p class="s">TOTAL BALANCE</p><div class="b" id="bal">₹0</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div style="background:#111;padding:12px;border-radius:14px;border-left:3px solid #22c55e"><p class="s">വരവ്</p><div class="g" id="inc" style="font-size:20px;font-weight:800">₹0</div></div>
<div style="background:#111;padding:12px;border-radius:14px;border-left:3px solid #ff4d4d"><p class="s">ചിലവ്</p><div class="r" id="exp" style="font-size:20px;font-weight:800">₹0</div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div style="background:#111;padding:12px;border-radius:14px;border-left:3px solid #ff9500"><p class="s">ഞാൻ കൊടുക്കാനുള്ളത്</p><div style="color:#ff9500;font-size:18px;font-weight:800" id="give">₹0</div></div>
<div style="background:#111;padding:12px;border-radius:14px;border-left:3px solid #0af"><p class="s">എനിക്ക് കിട്ടാനുള്ളത്</p><div style="color:#0af;font-size:18px;font-weight:800" id="get">₹0</div></div>
</div>
<div id="warn" style="margin-top:10px"></div></div>
<div class="card"><b>Recent</b><div id="recent"></div></div>
</div>

<!-- INCOME -->
<div id="p1" class="page">
<div class="card" style="border-color:#22c55e40"><h3 class="g">💰 വരവ് </h3>
<input id="ia" type="number" placeholder="തുക ₹" class="i">
<input id="inote" type="text" placeholder="Salary, Freelance..." class="i">
<label class="s">📷 Bill Photo (Optional)</label>
<input type="file" id="ipic" accept="image/*" capture="environment" class="i" onchange="preview('ipic','iprev')">
<img id="iprev" class="img-prev">
<button class="btn" style="background:#22c55e;color:#000;margin-top:8px" onclick="addT('income')">SAVE</button>
</div>
<div class="card"><div id="ilist"></div></div>
</div>

<!-- EXPENSE -->
<div id="p2" class="page">
<div class="card" style="border-color:#ff4d4d40"><h3 class="r">💸 ചിലവ്</h3>
<input id="ea" type="number" placeholder="തുക ₹" class="i">
<input id="enote" type="text" placeholder="Food, Petrol..." class="i">
<label class="s">📷 Bill Photo</label>
<input type="file" id="epic" accept="image/*" capture="environment" class="i" onchange="preview('epic','eprev')">
<img id="eprev" class="img-prev">
<button class="btn" style="background:#ff4d4d;color:#fff;margin-top:8px" onclick="addT('expense')">SAVE </button>
</div>
<div class="card"><div id="elist"></div></div>
</div>

<!-- KADAM -->
<div id="p3" class="page">
<div class="card" style="border-color:#ff950040"><h3 style="color:#ff9500">👥 കടം Tracker</h3>
<select id="ktype" class="i"><option value="give">ഞാൻ കൊടുത്തു - കിട്ടാനുണ്ട്</option><option value="get">ഞാൻ വാങ്ങി - കൊടുക്കാനുണ്ട്</option></select>
<input id="kname" type="text" placeholder="ആര്? ഉദാ: Ramesh" class="i">
<input id="ka" type="number" placeholder="തുക ₹" class="i">
<input id="knote" type="text" placeholder="എന്തിന്?" class="i">
<button class="btn" style="background:#ff9500;color:#000" onclick="addK()">SAVE </button>
</div>
<div class="card"><h3>കടം List</h3><div id="klist"></div></div>
</div>

<!-- REPORT -->
<div id="p4" class="page">
<div class="card"><h3>📊 Report</h3><canvas id="cv" width="340" height="180" style="width:100%;margin-top:10px"></canvas><div id="brk"></div></div>
<div class="card"><h3>📷 All Bill Photos</h3><div id="allpics" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"></div></div>
</div>

<div class="nav">
<button id="n0" class="on" onclick="go(0)">🏠<br>HOME</button>
<button id="n1" onclick="go(1)">💰<br>വരവ്</button>
<button id="n2" onclick="go(2)">💸<br>ചിലവ്</button>
<button id="n3" onclick="go(3)">👥<br>കടം</button>
<button id="n4" onclick="go(4)">📊<br>RPT</button>
</div>

<script>
let pin=localStorage.getItem('bt_pin')||'',cur='',firstPin='',mode=pin?'enter':'set';
if(!pin)document.getElementById('lockText').innerText='പുതിയ PIN Set ചെയ്യുക';else{document.getElementById('lockText').innerText='PIN അടിക്കുക';document.getElementById('skipBtn').style.display='none';}
function press(n){if(cur.length<4){cur+=n;upd();if(cur.length==4)setTimeout(chk,150);}}
function upd(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('on',i<cur.length)}
function clearPin(){cur='';upd();}function removePin(){cur=cur.slice(0,-1);upd();}
function chk(){if(mode=='set'&&!firstPin){firstPin=cur;cur='';upd();document.getElementById('lockText').innerText='Confirm ചെയ്യുക';return;}if(mode=='set'){if(cur==firstPin){localStorage.setItem('bt_pin',cur);document.getElementById('lockScreen').style.display='none';}else{alert('Match അല്ല');firstPin='';cur='';upd();}return;}if(cur==pin)document.getElementById('lockScreen').style.display='none';else{alert('തെറ്റായ PIN');cur='';upd();}}
function skipLock(){if(!localStorage.getItem('bt_pin'))document.getElementById('lockScreen').style.display='none';}
function changePin(){let p=prompt('പുതിയ PIN');if(p&&p.length==4){localStorage.setItem('bt_pin',p);alert('PIN മാറ്റി');location.reload();}}

let all=JSON.parse(localStorage.getItem('bt_all2')||'[]'),kad=JSON.parse(localStorage.getItem('bt_kad')||'[]'),limit=localStorage.getItem('bt_lim')||10000,tempPic={};
function save(){localStorage.setItem('bt_all2',JSON.stringify(all));localStorage.setItem('bt_kad',JSON.stringify(kad));}
function preview(inp,img){let f=document.getElementById(inp).files[0];if(!f)return;let r=new FileReader();r.onload=e=>{tempPic[inp]=e.target.result;let im=document.getElementById(img);im.src=e.target.result;im.style.display='block';};r.readAsDataURL(f);}
function addT(t){let a=document.getElementById(t=='income'?'ia':'ea').value,n=document.getElementById(t=='income'?'inote':'enote').value.trim(),pic=tempPic[t=='income'?'ipic':'epic']||'';if(!a||!n){alert('തുകയും പേരും വേണം');return;}all.unshift({id:Date.now(),a:parseInt(a),n:n,t:t,d:new Date().toLocaleDateString(),pic:pic});save();document.getElementById(t=='income'?'ia':'ea').value='';document.getElementById(t=='income'?'inote':'enote').value='';document.getElementById(t=='income'?'iprev':'eprev').style.display='none';tempPic={};draw();go(0);}
function addK(){let ty=document.getElementById('ktype').value,nm=document.getElementById('kname').value.trim(),a=document.getElementById('ka').value,no=document.getElementById('knote').value.trim();if(!nm||!a){alert('പേരും തുകയും വേണം');return;}kad.unshift({id:Date.now(),type:ty,name:nm,a:parseInt(a),note:no,d:new Date().toLocaleDateString(),paid:false});save();document.getElementById('kname').value='';document.getElementById('ka').value='';document.getElementById('knote').value='';draw();}
function draw(){
let inc=0,exp=0,map={},give=0,get=0;
all.forEach(x=>{if(x.t=='income')inc+=x.a;else{exp+=x.a;map[x.n]=(map[x.n]||0)+x.a;}});
kad.forEach(k=>{if(!k.paid){if(k.type=='give')get+=k.a;else give+=k.a;}});
document.getElementById('bal').innerText='₹'+(inc-exp);document.getElementById('inc').innerText='₹'+inc;document.getElementById('exp').innerText='₹'+exp;
document.getElementById('give').innerText='₹'+give;document.getElementById('get').innerText='₹'+get;
document.getElementById('recent').innerHTML=all.slice(0,6).map(x=>row(x)).join('')||'<p class=s>ഒന്നും ഇല്ല</p>';
document.getElementById('ilist').innerHTML=all.filter(x=>x.t=='income').map(x=>row(x)).join('')||'<p class=s>വരവ് ഇല്ല</p>';
document.getElementById('elist').innerHTML=all.filter(x=>x.t=='expense').map(x=>row(x)).join('')||'<p class=s>ചിലവ് ഇല്ല</p>';
document.getElementById('klist').innerHTML=kad.map(k=>`<div class=item><div><b>${k.name}</b> <span class=badge style="background:${k.type=='give'?'#0af33':'#ff950033'};color:${k.type=='give'?'#0af':'#ff9500'}">${k.type=='give'?'കിട്ടാനുണ്ട്':'കൊടുക്കാനുണ്ട്'}</span><br><span style="font-weight:800">₹${k.a}</span> ${k.note} <div class=s>${k.d} ${k.paid?'✅ PAID':''}</div></div><div><button onclick="paidK(${k.id})" style="background:${k.paid?'#222':'#22c55e'};border:none;color:#fff;padding:6px 10px;border-radius:8px;font-size:11px">${k.paid?'Undo':'Paid'}</button> <span onclick="delK(${k.id})" style="color:#555;font-size:22px;margin-left:6px">×</span></div></div>`).join('')||'<p class=s>കടം ഇല്ല</p>';
let c=document.getElementById('cv'),ctx=c.getContext('2d'),tot=Object.values(map).reduce((a,b)=>a+b,0);ctx.clearRect(0,0,340,180);
if(tot){let cols=['#ff3b30','#ff9500','#34c759','#007aff','#af52de'],st=-1.57;Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5).forEach(([k,v],i)=>{let ang=v/tot*6.283;ctx.beginPath();ctx.moveTo(170,90);ctx.arc(170,90,70,st,st+ang);ctx.fillStyle=cols[i%5];ctx.fill();st+=ang;});}
document.getElementById('brk').innerHTML=Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=item><span>${k}</span><b>₹${v}</b></div>`).join('');
document.getElementById('allpics').innerHTML=all.filter(x=>x.pic).map(x=>`<div style="position:relative"><img src="${x.pic}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid #333"><p class=s style="position:absolute;bottom:4px;left:4px;background:#000a;padding:2px 6px;border-radius:6px">₹${x.a} ${x.n}</p></div>`).join('')||'<p class=s>Bill ഇല്ല</p>';
let per=Math.round(exp/limit*100);document.getElementById('warn').innerHTML=`<div style="background:${per>90?'#ff3b3015':'#111'};border:1px solid ${per>90?'#ff3b3040':'#222'};padding:10px;border-radius:12px"><p class=s>Limit ₹${limit} • ${per}% ${per>90?'⚠️':'✅'}</p><div style="height:6px;background:#222;border-radius:10px;margin-top:6px"><div style="width:${Math.min(100,per)}%;background:${per>90?'#ff3b30':'#22c55e'};height:6px;border-radius:10px"></div></div></div>`;
}
function row(x){return `<div class=item><div><b style="color:${x.t=='income'?'#22c55e':'#ff4d4d'}">${x.t=='income'?'+':'-'}₹${x.a}</b> ${x.n} ${x.pic?'📷':''}<div class=s>${x.d}</div></div><span onclick="del(${x.id})" style="color:#555;font-size:22px">×</span></div>`}
function del(id){if(confirm('Delete?')){all=all.filter(x=>x.id!=id);save();draw();}}
function delK(id){if(confirm('Delete കടം?')){kad=kad.filter(x=>x.id!=id);save();draw();}}
function paidK(id){let k=kad.find(x=>x.id==id);if(k){k.paid=!k.paid;save();draw();}}
function go(i){document.querySelectorAll('.page').forEach((p,idx)=>p.classList.toggle('on',idx==i));document.querySelectorAll('.nav button').forEach((b,idx)=>b.classList.toggle('on',idx==i));}
function setLim(){let v=prompt('Monthly Limit?',limit);if(v){limit=v;localStorage.setItem('bt_lim',limit);draw();}}
draw();
</script>
</body>
</html>
